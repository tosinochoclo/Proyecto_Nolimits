<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <!-- Gradiente Cielo Windows XP Bliss -->
    <linearGradient id="blissSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1467cb"/>
      <stop offset="25%" stop-color="#2d87e6"/>
      <stop offset="48%" stop-color="#67b2f8"/>
      <stop offset="65%" stop-color="#9ed1fb"/>
      <stop offset="78%" stop-color="#d9eeff"/>
    </linearGradient>

    <!-- Gradiente Colina Verde Bliss -->
    <linearGradient id="blissHill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#73c81d"/>
      <stop offset="20%" stop-color="#58b314"/>
      <stop offset="55%" stop-color="#3c9110"/>
      <stop offset="100%" stop-color="#236009"/>
    </linearGradient>

    <!-- Gradiente Letras 3D LMTS -->
    <linearGradient id="logoLetterGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#edf6ff"/>
      <stop offset="75%" stop-color="#c1e0fc"/>
      <stop offset="100%" stop-color="#92c4f8"/>
    </linearGradient>

    <!-- Gradiente Sombra/Bisel LMTS -->
    <linearGradient id="bevelGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4995e8"/>
      <stop offset="100%" stop-color="#185ba5"/>
    </linearGradient>

    <!-- Filtro de Sombra Suave y Resplandor 2000s -->
    <filter id="logoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0e3d7a" flood-opacity="0.45"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0a2a54" flood-opacity="0.35"/>
    </filter>

    <filter id="cloudBlur" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- CIELO AZUL BLISS -->
  <rect width="1000" height="1000" fill="url(#blissSky)"/>

  <!-- NUBES BLANCAS ALGODONOSAS (Windows XP Style) -->
  <g fill="#ffffff" opacity="0.88" filter="url(#cloudBlur)">
    <!-- Nube alta izquierda -->
    <ellipse cx="140" cy="90" rx="90" ry="32"/>
    <ellipse cx="90" cy="110" rx="60" ry="24"/>
    <ellipse cx="210" cy="100" rx="75" ry="28"/>
    <ellipse cx="160" cy="65" rx="55" ry="25"/>

    <!-- Nube alta derecha grande -->
    <ellipse cx="800" cy="110" rx="140" ry="45"/>
    <ellipse cx="880" cy="130" rx="90" ry="35"/>
    <ellipse cx="730" cy="120" rx="100" ry="38"/>
    <ellipse cx="820" cy="80" rx="80" ry="35"/>
    <ellipse cx="860" cy="50" rx="60" ry="28"/>

    <!-- Nubes intermedias -->
    <ellipse cx="380" cy="220" rx="110" ry="35"/>
    <ellipse cx="440" cy="235" rx="90" ry="30"/>
    <ellipse cx="330" cy="230" rx="70" ry="25"/>
    <ellipse cx="390" cy="195" rx="60" ry="25"/>

    <ellipse cx="580" cy="310" rx="130" ry="40"/>
    <ellipse cx="660" cy="330" rx="90" ry="30"/>
    <ellipse cx="520" cy="320" rx="80" ry="28"/>

    <ellipse cx="180" cy="340" rx="100" ry="30"/>
    <ellipse cx="240" cy="355" rx="70" ry="24"/>
    <ellipse cx="130" cy="350" rx="60" ry="20"/>

    <ellipse cx="820" cy="340" rx="110" ry="32"/>
    <ellipse cx="760" cy="355" rx="80" ry="26"/>
  </g>

  <!-- COLINA VERDE ONDULADA (Bliss Hill) -->
  <path d="M 0,530 Q 300,500 520,535 T 1000,560 L 1000,1000 L 0,1000 Z" fill="url(#blissHill)"/>
  <!-- Capa de césped inferior y sombras sutiles de la colina -->
  <path d="M 0,620 Q 350,590 680,630 T 1000,660 L 1000,1000 L 0,1000 Z" fill="#296c0d" opacity="0.25"/>

  <!-- ===================================================================
       LOGO CENTRAL LMTS ® (Estilo 3D Glossy Y2K)
       =================================================================== -->
  <g transform="translate(50, 400)" filter="url(#logoShadow)">

    <!-- 1. ÍCONO DOBLE-SWOOSH / ALETA (IZQUIERDA) -->
    <g>
      <!-- Aleta posterior -->
      <path d="M 125,5 Q 185,55 210,135 Q 165,115 135,130 Q 155,75 125,5 Z"
            fill="url(#bevelGrad)" stroke="#1a559e" stroke-width="12" stroke-linejoin="round"/>
      <path d="M 125,5 Q 185,55 210,135 Q 165,115 135,130 Q 155,75 125,5 Z"
            fill="url(#logoLetterGrad)"/>

      <!-- Aleta principal frontal -->
      <path d="M 5,5 Q 85,60 120,150 Q 80,120 45,145 Q 65,80 5,5 Z"
            fill="url(#bevelGrad)" stroke="#1a559e" stroke-width="14" stroke-linejoin="round"/>
      <path d="M 5,5 Q 85,60 120,150 Q 80,120 45,145 Q 65,80 5,5 Z"
            fill="url(#logoLetterGrad)"/>
    </g>

    <!-- 2. LETRA 'L' -->
    <g transform="translate(235, 10)">
      <path d="M 10,10 L 48,10 Q 54,10 54,16 L 54,95 L 98,95 Q 104,95 104,101 L 104,136 Q 104,142 98,142 L 10,142 Q 4,142 4,136 L 4,16 Q 4,10 10,10 Z"
            fill="url(#bevelGrad)" stroke="#1f6ec5" stroke-width="16" stroke-linejoin="round"/>
      <path d="M 10,10 L 48,10 Q 54,10 54,16 L 54,95 L 98,95 Q 104,95 104,101 L 104,136 Q 104,142 98,142 L 10,142 Q 4,142 4,136 L 4,16 Q 4,10 10,10 Z"
            fill="url(#logoLetterGrad)"/>
    </g>

    <!-- 3. LETRA 'M' -->
    <g transform="translate(365, 10)">
      <path d="M 10,10 L 46,10 Q 52,10 56,15 L 85,75 L 114,15 Q 118,10 124,10 L 160,10 Q 166,10 166,16 L 166,136 Q 166,142 160,142 L 126,142 Q 120,142 120,136 L 120,62 L 95,112 Q 91,120 85,120 Q 79,120 75,112 L 50,62 L 50,136 Q 50,142 44,142 L 10,142 Q 4,142 4,136 L 4,16 Q 4,10 10,10 Z"
            fill="url(#bevelGrad)" stroke="#1f6ec5" stroke-width="16" stroke-linejoin="round"/>
      <path d="M 10,10 L 46,10 Q 52,10 56,15 L 85,75 L 114,15 Q 118,10 124,10 L 160,10 Q 166,10 166,16 L 166,136 Q 166,142 160,142 L 126,142 Q 120,142 120,136 L 120,62 L 95,112 Q 91,120 85,120 Q 79,120 75,112 L 50,62 L 50,136 Q 50,142 44,142 L 10,142 Q 4,142 4,136 L 4,16 Q 4,10 10,10 Z"
            fill="url(#logoLetterGrad)"/>
    </g>

    <!-- 4. LETRA 'T' -->
    <g transform="translate(560, 10)">
      <path d="M 8,10 L 116,10 Q 122,10 122,16 L 122,46 Q 122,52 116,52 L 80,52 L 80,136 Q 80,142 74,142 L 42,142 Q 36,142 36,136 L 36,52 L 8,52 Q 2,52 2,46 L 2,16 Q 2,10 8,10 Z"
            fill="url(#bevelGrad)" stroke="#1f6ec5" stroke-width="16" stroke-linejoin="round"/>
      <path d="M 8,10 L 116,10 Q 122,10 122,16 L 122,46 Q 122,52 116,52 L 80,52 L 80,136 Q 80,142 74,142 L 42,142 Q 36,142 36,136 L 36,52 L 8,52 Q 2,52 2,46 L 2,16 Q 2,10 8,10 Z"
            fill="url(#logoLetterGrad)"/>
    </g>

    <!-- 5. LETRA 'S' -->
    <g transform="translate(700, 10)">
      <path d="M 28,38 Q 42,10 85,10 Q 128,10 138,40 Q 142,55 130,70 Q 115,85 75,95 Q 45,102 45,112 Q 45,120 58,124 Q 72,128 92,122 Q 106,118 114,124 L 128,142 Q 110,154 84,154 Q 40,154 26,130 Q 16,112 24,94 Q 38,72 80,62 Q 108,54 108,44 Q 108,36 96,33 Q 80,30 62,34 Q 46,38 38,32 Z"
            fill="url(#bevelGrad)" stroke="#1f6ec5" stroke-width="16" stroke-linejoin="round"/>
      <path d="M 28,38 Q 42,10 85,10 Q 128,10 138,40 Q 142,55 130,70 Q 115,85 75,95 Q 45,102 45,112 Q 45,120 58,124 Q 72,128 92,122 Q 106,118 114,124 L 128,142 Q 110,154 84,154 Q 40,154 26,130 Q 16,112 24,94 Q 38,72 80,62 Q 108,54 108,44 Q 108,36 96,33 Q 80,30 62,34 Q 46,38 38,32 Z"
            fill="url(#logoLetterGrad)"/>
    </g>

    <!-- 6. ÍCONO DE MARCA REGISTRADA ® -->
    <g transform="translate(860, 95)">
      <!-- Círculo exterior -->
      <circle cx="22" cy="22" r="20" fill="url(#logoLetterGrad)" stroke="#1f6ec5" stroke-width="6"/>
      <!-- Letra R -->
      <text x="22" y="29" font-family="'Arial Black', sans-serif" font-size="20" font-weight="900" fill="#185ba5" text-anchor="middle">R</text>
    </g>
  </g>
</svg>
